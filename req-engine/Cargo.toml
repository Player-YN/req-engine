[package]
name = "req-engine"
version = "0.1.0"
edition = "2021"
description = "Requirements Engine — verb-based task state machine (zero LLM)"
license = "MIT"

[[bin]]
name = "req-engine"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "sync"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
# Official MCP SDK (stdio server). Features: tools + stdio transport.
rmcp = { version = "3.1", features = ["server", "transport-io"] }
schemars = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Native Windows (and cross-platform) window hosting WebView2/WebKit
wry = "0.47"
tao = "0.30"
# Native folder picker for desktop shell (absolute path)
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
# System tray (close hides; quit from tray)
tray-icon = "0.21"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
