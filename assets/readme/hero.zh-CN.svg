<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">需求引擎</title>
  <desc id="desc">零 LLM 本地动词仓库。状态是动词的结果，不是 set_status。讨论席与实现席用匹配码绑定 Agent；人完成审核。引擎从不调用模型。右侧看板为示意图，不是截图。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8eef5"/>
      <stop offset="1" stop-color="#f3f4f6"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#5c2d91"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="16" fill="url(#bg)"/>

  <g id="title-block">
    <text x="56" y="68" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#005fb8" letter-spacing="1.6">本地 · 零 LLM 状态库</text>
    <text x="56" y="132" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="54" font-weight="700" fill="#1a1a1a">需求引擎</text>
    <text x="56" y="178" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#1a1a1a">动词驱动的需求落在磁盘上。</text>
    <text x="56" y="210" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#1a1a1a">引擎从不调用模型。</text>

    <rect x="56" y="240" width="86" height="32" rx="6" fill="#ffffff" stroke="#c5cdd6"/>
    <text x="99" y="261" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Segoe UI, monospace" font-size="16" fill="#1a1a1a">Rust</text>
    <rect x="150" y="240" width="98" height="32" rx="6" fill="#ffffff" stroke="#c5cdd6"/>
    <text x="199" y="261" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Segoe UI, monospace" font-size="16" fill="#1a1a1a">SQLite</text>
    <rect x="256" y="240" width="148" height="32" rx="6" fill="#ffffff" stroke="#c5cdd6"/>
    <text x="330" y="261" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Segoe UI, monospace" font-size="16" fill="#1a1a1a">MCP --pair</text>
    <rect x="412" y="240" width="126" height="32" rx="6" fill="#ffffff" stroke="#c5cdd6"/>
    <text x="475" y="261" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Segoe UI, monospace" font-size="16" fill="#1a1a1a">WebView2</text>

    <rect x="56" y="288" width="232" height="36" rx="6" fill="#f3e8e6" stroke="#c42b1c"/>
    <text x="172" y="311" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Segoe UI, monospace" font-size="16" font-weight="700" fill="#c42b1c">no set_status</text>
  </g>

  <g id="project-proof">
    <rect x="620" y="40" width="528" height="320" rx="8" fill="#ffffff" stroke="#c5cdd6"/>
    <rect x="620" y="40" width="528" height="36" rx="8" fill="#f3f3f3"/>
    <rect x="620" y="64" width="528" height="12" fill="#f3f3f3"/>
    <rect x="632" y="50" width="16" height="16" rx="3" fill="url(#glyph)"/>
    <text x="656" y="63" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5d5d5d">看板 · 示意图</text>
    <text x="1132" y="63" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#5d5d5d">:7420</text>

    <rect x="636" y="88" width="118" height="196" rx="6" fill="#f7f8fa" stroke="#dde3ea"/>
    <rect x="762" y="88" width="118" height="196" rx="6" fill="#f7f8fa" stroke="#dde3ea"/>
    <rect x="888" y="88" width="118" height="196" rx="6" fill="#f7f8fa" stroke="#dde3ea"/>
    <rect x="1014" y="88" width="118" height="196" rx="6" fill="#f7f8fa" stroke="#dde3ea"/>

    <text x="695" y="114" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#5d5d5d">todo</text>
