    <text x="947" y="114" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#5d5d5d">review</text>
    <text x="1073" y="114" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#5d5d5d">done</text>

    <rect x="646" y="128" width="98" height="70" rx="6" fill="#ffffff" stroke="#005fb8"/>
    <text x="695" y="156" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#005fb8">create</text>
    <text x="695" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#5d5d5d">disc_</text>

    <rect x="772" y="128" width="98" height="70" rx="6" fill="#ffffff" stroke="#9d5d00"/>
    <text x="821" y="156" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#9d5d00">claim</text>
    <text x="821" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#5d5d5d">build_</text>

    <rect x="898" y="128" width="98" height="70" rx="6" fill="#ffffff" stroke="#5c2d91"/>
    <text x="947" y="156" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#5c2d91">submit</text>
    <text x="947" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#5d5d5d">build_</text>

    <rect x="1024" y="128" width="98" height="70" rx="6" fill="#ffffff" stroke="#1a1a1a"/>
    <text x="1073" y="156" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#1a1a1a">pass</text>
    <text x="1073" y="180" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5d5d5d">人审</text>

    <text x="695" y="226" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5d5d5d">讨论</text>
    <text x="821" y="226" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5d5d5d">实现</text>
    <text x="947" y="226" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5d5d5d">实现</text>
    <text x="1073" y="226" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#c42b1c">仅管理员</text>

    <rect x="636" y="296" width="246" height="48" rx="6" fill="#e8f1fa" stroke="#005fb8"/>
    <text x="759" y="318" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#005fb8">disc_  讨论席</text>
    <text x="759" y="336" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5d5d5d">建 / 改 todo</text>

    <rect x="890" y="296" width="246" height="48" rx="6" fill="#f4eef8" stroke="#5c2d91"/>
    <text x="1013" y="318" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#5c2d91">build_  实现席</text>
    <text x="1013" y="336" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5d5d5d">认领 → 交审</text>
  </g>
</svg>
